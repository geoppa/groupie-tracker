<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Groupie Tracker</title>
</head>
<body>

   <header class="site-header">
    <div class="site-brand">
        <a href="/">Groupie Tracker</a>
    </div>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>

    <div class="user-controls">
        <div class="theme-selector">
            <button type="button" class="theme-button theme-modern">
                <span class="theme-dot" aria-hidden="true"></span>
                <span class="theme-name">Modern</span>
            </button>
            <button type="button" class="theme-button theme-inferno">
                <span class="theme-dot" aria-hidden="true"></span>
                <span class="theme-name">Inferno</span>
            </button>
            <button type="button" class="theme-button theme-neon">
                <span class="theme-dot" aria-hidden="true"></span>
                <span class="theme-name">Neon</span>
            </button>
        </div>
    </div>
</header>
   
    <h1>🎤 Groupie Tracker 🎤</h1>
    
    <div class="container">
        <!-- Loop through each artist passed from Go -->
        {{range .}}
        <div class="card">
            <img src="{{.Image}}" alt="{{.Name}}">
            <h3>{{.Name}}</h3>
            <p>Created: {{.CreationDate}}</p>
            <p>First Album: {{.FirstAlbum}}</p>
        </div>
        {{end}}
    </div>

    <script src="/static/js/theme.js" defer></script>
</body>
</html>
