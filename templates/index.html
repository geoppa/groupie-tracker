<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; padding: 15px; text-align: center; }
        .card img { width: 100%; border-radius: 4px; }
        .card h3 { margin: 10px 0 5px 0; color: #222; }
        .card p { font-size: 14px; color: #666; margin: 0; }
    </style>
</head>
<body>

    <h1>🎤 Groupie Tracker 🎤</h1>
    
    <div class="container">
        <!-- Loop through each artist passed from Go -->
        {{range .}}
        <div class="card">
            <img src="{{.Image}}" alt="{{.Name}}">
            <h3>{{.Name}}</h3>
            <p>Created: {{.CreationDate}}</p>
            <p>First Album: {{.FirstAlbum}}</p>
        </div>
        {{end}}
    </div>

</body>
</html>
